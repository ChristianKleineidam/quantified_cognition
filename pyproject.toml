[project]
name = "quantified-cognition"
version = "0.23.1"
description = "Daily recall and memory formation relative to Anki's FSRS predictions"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
